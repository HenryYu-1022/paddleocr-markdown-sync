[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "paddleocr-markdown-sync"
version = "0.1.0"
description = "通过 PaddleOCR 在线 API 将 PDF 文献库增量转换为 Markdown"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "HenryYu-1022" }]
dependencies = [
  "platformdirs>=4.2",
  "pypdf>=5.0",
  "requests>=2.31",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
test = [
  "build>=1.2",
  "pytest>=8.0",
]

[project.scripts]
paddleocr-md = "paddleocr_markdown_sync.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/paddleocr_markdown_sync"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
